services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: week_24
      MARIADB_USER: week_24
      MARIADB_PASSWORD: week_24
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb:/var/lib/mysql

  app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: week_24
      DB_PASSWORD: week_24
      DB_NAME: week_24
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:${PORT:-3000}/api/auth/google/callback
      APP_URL: http://localhost:${PORT:-3000}/

volumes:
  mariadb: